name: Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run P0 M&E unit smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_p0_me_smoke.py tests/test_classify_isolation.py tests/test_review_routes.py tests/test_confirmed_kb.py tests/test_p1_fence_eval.py tests/test_p1_claim_binding.py tests/test_p1_faithfulness_eval.py tests/test_p1_numeric_verifier.py tests/test_p1_critic_adversarial.py tests/test_p1_phase1_faithfulness.py tests/test_report_fact_safety_service.py tests/test_fact_safety_critic_agent.py tests/test_gate1_confirmation.py tests/test_gap_check_routes.py tests/test_section_insufficiency.py tests/test_full_walk_exit_codes.py tests/test_p3_eval_harness.py tests/test_gap_compliance_agent.py::test_fcdo_complete_distilled_gap_set_exact tests/test_orchestrator_critique.py::test_gate3_resume_does_not_re_run_critic -q
      - name: P3-4 hard_red faithfulness gates (blocking)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -m hard_red tests/test_p3_4_output_quality.py -q
      - name: P3-1 offline replay (fixture)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit/offline_replay.py --fixture
      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          TEST_MODE_SECRET: ${{ secrets.TEST_MODE_SECRET }}
        run: python scripts/smoke_test.py
      - name: Run optional Track B
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          TEST_MODE_SECRET: ${{ secrets.TEST_MODE_SECRET }}
        run: python scripts/e2e_auth_profile_test.py
      - name: Slack alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured; skipping notification."
            exit 0
          fi
          payload='{"text":"GrantPilot smoke test failed on main. Check workflow logs for failing step and request_id."}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
