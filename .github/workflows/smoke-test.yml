name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  governance-guards:
    name: governance-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diff-aware governance guards (blocking)
        env:
          # Never honour a workflow-injected override; per-commit message only.
          GOVERNANCE_OVERRIDE: ""
        run: |
          unset GOVERNANCE_OVERRIDE || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
            MB=$(git merge-base "$BASE" "$HEAD")
            RANGE="$MB..$HEAD"
          else
            BEFORE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                BEFORE=$(git rev-parse HEAD~1)
                echo "before SHA missing; falling back to HEAD~1 ($BEFORE)"
              else
                echo "No parent commit available; failing closed."
                exit 1
              fi
            fi
            MB=$(git merge-base "$BEFORE" "$HEAD")
            RANGE="$MB..$HEAD"
          fi
          echo "Scanning range: $RANGE (merge-base two-dot)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE=blocking
          else
            MODE=report
            echo "Protected-file mode=report (D-078): PR review authorises protected paths; funder/fixture, harness-import, and secret remain blocking on all events."
          fi
          python scripts/governance/run_guards.py --range "$RANGE" --layer ci --protected-file-mode "$MODE"
      - name: Render override trail from PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          MB=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "## GOVERNANCE_OVERRIDE trail (merge-base..head = $MB..$HEAD_SHA)"
          git log "${MB}..${HEAD_SHA}" --format="%H %s" | while read -r sha subject; do
            body=$(git log -1 --format=%B "$sha")
            echo "$body" | grep -E '^GOVERNANCE_OVERRIDE:' | while read -r line; do
              echo "- sha=${sha:0:12} $line"
            done
          done
          if ! git log "${MB}..${HEAD_SHA}" --format=%B | grep -q '^GOVERNANCE_OVERRIDE:'; then
            echo "_No GOVERNANCE_OVERRIDE lines in this range._"
          fi

  governance-tree-audit:
    name: governance-tree-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report-only tree audit
        run: |
          mkdir -p docs/artefacts/me_module/audits
          python scripts/governance/tree_audit.py \
            --md-out docs/artefacts/me_module/audits/G1_TREE_AUDIT_CI.md \
            --json-out docs/artefacts/me_module/audits/G1_TREE_AUDIT_CI.json
      - name: Upload tree-audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: g1-tree-audit
          path: docs/artefacts/me_module/audits/G1_TREE_AUDIT_CI.*
      - name: Comment tree audit on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(python - <<'PY'
          from pathlib import Path
          text = Path("docs/artefacts/me_module/audits/G1_TREE_AUDIT_CI.md").read_text(encoding="utf-8")
          # Keep comment bounded
          lines = text.splitlines()
          if len(lines) > 120:
              text = "\n".join(lines[:120]) + "\n\n_(truncated; full report in workflow artifact `g1-tree-audit`)_\n"
          print(text)
          PY
          )
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run P0 M&E unit smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_p0_me_smoke.py tests/test_classify_isolation.py tests/test_review_routes.py tests/test_confirmed_kb.py tests/test_conflict_integrity.py tests/test_gate1_orphan_repair_evidence.py tests/test_p1_fence_eval.py tests/test_p1_claim_binding.py tests/test_p1_faithfulness_eval.py tests/test_p1_numeric_verifier.py tests/test_p1_critic_adversarial.py tests/test_p1_phase1_faithfulness.py tests/test_report_fact_safety_service.py tests/test_fact_safety_critic_agent.py tests/test_gate1_confirmation.py tests/test_knowledge_bank_patch.py tests/test_gap_check_routes.py tests/test_gap_question_copy.py tests/test_auth_account_linking.py tests/test_proposal_extractor_agent.py tests/test_proposal_extraction_checkpoint.py tests/test_proposal_failure_narrative_elevation.py tests/test_section_insufficiency.py tests/test_section_visibility.py tests/test_report_inputs_builder.py tests/test_disaggregation_promotion.py tests/test_proposal_content_capture.py tests/test_monitoring_notes_capture.py tests/test_synthesis_parse_resilience.py tests/test_export_identifier_leak.py tests/test_funder_table_rendering.py tests/test_full_walk_exit_codes.py tests/test_p3_eval_harness.py tests/test_gap_compliance_agent.py::test_fcdo_complete_distilled_gap_set_exact tests/test_orchestrator_critique.py::test_gate3_resume_does_not_re_run_critic -q
      # Named async gate tests — verbose so the job log proves they EXECUTE (not silent-skip).
      - name: Prove async gate tests execute
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_conflict_integrity.py::test_reconcile_and_persist_normalizes_orphan_at_seam tests/test_gap_compliance_agent.py::test_fcdo_complete_distilled_gap_set_exact -v --tb=short
      - name: P3-4 hard_red faithfulness gates (blocking)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -m hard_red tests/test_p3_4_output_quality.py -q
      - name: P3-1 offline replay (fixture)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit/offline_replay.py --fixture
      # Live HTTP smoke needs production secrets; skip on pull_request so Layer-1 CI can certify PR heads.
      - name: Run smoke tests
        if: github.event_name != 'pull_request'
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          TEST_MODE_SECRET: ${{ secrets.TEST_MODE_SECRET }}
        run: python scripts/smoke_test.py
      - name: Run optional Track B
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          TEST_MODE_SECRET: ${{ secrets.TEST_MODE_SECRET }}
        run: python scripts/e2e_auth_profile_test.py
      - name: Slack alert on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured; skipping notification."
            exit 0
          fi
          payload='{"text":"GrantPilot smoke test failed on main. Check workflow logs for failing step and request_id."}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
